<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro — VectoFlow</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="logo">Vecto<span>Flow</span></div>

    <div class="card">
        <h2>Crear cuenta</h2>
        <p class="subtitulo">Ingresa tus datos para registrarte</p>

        <div class="grupo">
            <label>Nombre</label>
            <input type="text" id="nombre" placeholder="ej. Juan">
        </div>

        <div class="grupo">
            <label>Apellido</label>
            <input type="text" id="apellido" placeholder="ej. Pérez">
        </div>

        <div class="grupo">
            <label>Correo electrónico</label>
            <input type="email" id="correo" placeholder="correo@ejemplo.com">
        </div>

        <div class="grupo">
            <label>Contraseña</label>
            <div class="password-box">
                <input type="password" id="password" placeholder="Mínimo 6 caracteres">
                <span class="ver" onclick="togglePassword()">👁</span>
            </div>
        </div>

        <div class="grupo">
            <label>¿Cuál es tu rol?</label>
            <div class="rol-opciones">
                <div class="rol-chip" onclick="seleccionarRol('estudiante', this)">
                    <span class="emoji">🎓</span>
                    Estudiante
                </div>
                <div class="rol-chip" onclick="seleccionarRol('docente', this)">
                    <span class="emoji">📋</span>
                    Docente
                </div>
            </div>
            <input type="hidden" id="rol" value="">
        </div>

        <div id="msg-error" class="msg-error"></div>
        <div id="msg-exito" class="msg-exito"></div>

        <button class="btn-primario" onclick="registrar()">Crear cuenta</button>

        <div class="registro">
            ¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a>
        </div>
    </div>

    <script src="../js/registro.js"></script>
</body>
</html>
