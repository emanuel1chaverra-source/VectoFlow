<!DOCTYPE html>
<!-- Documento HTML5 -->
<html lang="es">
<head>
    <!-- Codificación UTF-8 para soporte de tildes y caracteres especiales -->
    <meta charset="UTF-8">
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Recuperar contraseña</title>

    <!-- Hoja de estilos global con variables CSS (colores, fuentes, sombras, fondo) -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Hoja de estilos del login/registro: card, inputs, botón, links -->
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <!-- Logo de la aplicación centrado en la parte superior.
         Estilizado por la clase .logo definida en style.css. -->
    <div class="logo">VectoFlow</div>

    <!-- ====
         CARD — Tarjeta central con el formulario de recuperación de contraseña
    ==== -->
    <div class="card">

        <!-- Título principal del formulario -->
        <h2>Recuperar contraseña</h2>

        <!-- Instrucción para el usuario: debe ingresar su nombre de usuario -->
        <p class="texto">
            Ingresa tu usuario para recuperar tu contraseña
        </p>

        <!-- Campo de texto para ingresar el nombre de usuario.
             El JS en recuperar.js lee este valor al hacer clic en el botón. -->
        <input type="text" id="usuario" placeholder="Usuario">

        <!-- Botón de acción: llama a recuperar() en recuperar.js
             que procesa la solicitud de recuperación de contraseña. -->
        <button onclick="recuperar()">Recuperar</button>

        <!-- Contenedor de mensajes de respuesta (éxito o error).
             El JS actualiza su contenido y visibilidad según el resultado. -->
        <p id="mensaje" class="mensaje"></p>

        <!-- Enlace para volver al login si el usuario recuerda su contraseña. -->
        <a href="login.html" class="link">Volver al login</a>
    </div>

    <!-- recuperar.js: maneja la función recuperar() que valida el usuario
         y muestra el mensaje de respuesta correspondiente -->
    <script src="../js/recuperar.js"></script>
</body>
</html>
